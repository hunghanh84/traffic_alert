services:
  # ─────────────────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: traffic_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - traffic_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Laravel Backend API (PHP 8.2 + Composer)
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./traffic-alert-backend
      dockerfile: Dockerfile
    container_name: traffic_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Traffic Alert System"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-laravel}

      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database

      DETECTION_API_URL: http://detection-service:8001
      YOLO_API_URL: http://yolo-api:5000

      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: "Traffic Alert System"

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      TELEGRAM_BOT_LINK: ${TELEGRAM_BOT_LINK}
    # ports:
    #   - "8000:8000"
    volumes:
      - backend_storage:/var/www/html/storage/app
      - backend_logs:/var/www/html/storage/logs
    networks:
      - traffic_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────
  # Vue 3 Frontend — multi-stage: Node build → Nginx serve
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./traffic-alert-frontend
      dockerfile: Dockerfile
    container_name: traffic_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # ports:
    #   - "3000:80"
    networks:
      - traffic_net

  # ─────────────────────────────────────────────────────────
  # Traffic Detection Service (FastAPI + TensorFlow/MobileNet)
  # ─────────────────────────────────────────────────────────
  detection-service:
    build:
      context: ./traffic-alert-service
      dockerfile_inline: |
        FROM python:3.10-slim

        RUN apt-get update && apt-get install -y --no-install-recommends \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 curl \
            && rm -rf /var/lib/apt/lists/*

        WORKDIR /app

        COPY requirements.txt ./
        RUN pip install --no-cache-dir --upgrade pip \
            && pip install --no-cache-dir -r requirements.txt

        COPY . .
        RUN mkdir -p models

        EXPOSE 8001
        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    container_name: traffic_detection_service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      RELOAD: "false"
      MODEL_PATH: models/train_detection_model.keras
      DEVICE: cpu
      LARAVEL_API_URL: http://backend:8000/api
    # ports:
    #   - "8001:8001"
    volumes:
      - detection_models:/app/models
    networks:
      - traffic_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────
  # YOLO Verification API (Flask + YOLOv8 + ffmpeg)
  # ─────────────────────────────────────────────────────────
  yolo-api:
    build:
      context: ./ai-detection
      dockerfile_inline: |
        FROM python:3.10-slim

        RUN apt-get update && apt-get install -y --no-install-recommends \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 \
            ffmpeg wget curl \
            && rm -rf /var/lib/apt/lists/*

        WORKDIR /app

        COPY requirements.txt requirements_api.txt ./
        RUN pip install --no-cache-dir --upgrade pip \
            && pip install --no-cache-dir flask flask-cors python-dotenv \
            && pip install --no-cache-dir -r requirements_api.txt \
            && pip install --no-cache-dir -r requirements.txt

        COPY . .
        RUN mkdir -p /app/MODEL

        EXPOSE 5000
        CMD ["python", "yolo_api.py"]
    container_name: traffic_yolo_api
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000/api/ai/detect
      API_TOKEN: ${YOLO_API_TOKEN:-}
      MODEL_PATH: /app/MODEL/best.pt
      CONFIDENCE_THRESHOLD: "0.7"
      FRAME_SKIP: "30"
      DETECTION_INTERVAL: "5"
      SHOW_WINDOW: "false"
    volumes:
      - yolo_model:/app/MODEL
    networks:
      - traffic_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # Central Nginx Gateway
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: traffic_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - detection-service
      - yolo-api
    networks:
      - traffic_net

# ─────────────────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local
  detection_models:
    driver: local
  yolo_model:
    driver: local

# ─────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────
networks:
  traffic_net:
    driver: bridge
